[project]
name = "stockclust"
version = "0.1.0"
description = "K-means++ and DBSCAN clustering of S&P 500 stocks on price-derived features"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "yfinance>=0.2.54",
    "pyarrow>=16",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockclust"]

[tool.pytest.ini_options]
testpaths = ["tests"]
